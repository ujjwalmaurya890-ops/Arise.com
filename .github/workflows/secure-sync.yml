name: Secure sync checks
on:
  pull_request:
  push:
    branches: [main, 'arena/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Actual Firestore rules and transaction tests
        run: npx --yes firebase-tools@15.1.0 emulators:exec --only firestore --project demo-arise-security "npm run test:rules"
      - name: Chromium dashboard, migration transport and second-device checks
        run: |
          npm start > /tmp/arise-test-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          node -e '
            const url = "http://127.0.0.1:8123";
            const deadline = Date.now() + 60000;
            (async () => {
              while (Date.now() < deadline) {
                try {
                  const response = await fetch(url, { signal: AbortSignal.timeout(2000) });
                  if (response.ok) {
                    console.log(`Test server ready (${response.status})`);
                    return;
                  }
                } catch {}
                await new Promise(resolve => setTimeout(resolve, 500));
              }
              console.error("Test server did not become ready within 60 seconds");
              process.exit(1);
            })();
          '
          npm run test:browser
