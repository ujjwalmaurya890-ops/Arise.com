[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/ai-ask"
  to = "/.netlify/functions/ai-ask"
  status = 200

[[redirects]]
  from = "/api/sync"
  to = "/.netlify/functions/sync"
  status = 200

[[redirects]]
  from = "/api/leetcode/*"
  to = "/.netlify/functions/leetcode/:splat"
  status = 200

[[redirects]]
  from = "/api/codechef/*"
  to = "/.netlify/functions/codechef/:splat"
  status = 200

[[redirects]]
  from = "/api/gfg/*"
  to = "/.netlify/functions/gfg/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/sounds/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/chunks/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    # These filenames aren't content-hashed on build, so "immutable, 1 year"
    # meant browsers never even checked for a new deploy. A short max-age
    # with must-revalidate lets the browser do a cheap conditional GET
    # (304 on no change) instead of blindly trusting a year-old cache.
    Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"
