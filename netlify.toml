[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/ai-ask"
  to = "/.netlify/functions/ai-ask"
  status = 200

[[redirects]]
  from = "/api/sync"
  to = "/.netlify/functions/sync"
  status = 200

[[redirects]]
  from = "/api/leetcode/*"
  to = "/.netlify/functions/leetcode/:splat"
  status = 200

[[redirects]]
  from = "/api/codechef/*"
  to = "/.netlify/functions/codechef/:splat"
  status = 200

[[redirects]]
  from = "/api/gfg/*"
  to = "/.netlify/functions/gfg/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Cache policy ──────────────────────────────────────────────────────────────
# v238 perf: these rules used to stop at the publish root. Netlify's header globs
# are literal single-segment globs (there is no `**` notation and `*` does not cross
# `/`), so `/*.js` and `/*.css` never reached anything under assets/ or features/ —
# ~150 shipped files, including assets/app-bundle.js (1,047 KB raw / ~295 KB gz)
# and all 12 widget chunks, were served with Netlify's default
# `max-age=0, must-revalidate` and paid a conditional round-trip on every visit.
# More-specific paths win over broader ones, so the immutable chunk rule is listed
# before the general /assets/ ones. Mirrored in ./_headers; test-cache-policy.cjs
# fails if the two diverge or if any shipped file ends up uncovered.
[[headers]]
  # the shell must always revalidate so a new deploy is picked up
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  # same for the SW, or a stale worker keeps serving stale chunks
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  # looping ambience, edited by hand at most
  for = "/sounds/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # These filenames aren't content-hashed on build, so "immutable, 1 year" meant
  #    # browsers never even checked for a new deploy. A short max-age with
  #    # must-revalidate lets the browser do a cheap conditional GET (304 on no change)
  #    # instead of blindly trusting a year-old cache.
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
  # build.mjs / serve.mjs are developer tooling, but they live in the publish dir
  for = "/*.mjs"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
  # root-level data payload (interview_sheets_data.json, 136 KB raw / ~14 KB gz)
  for = "/*.json"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
  # wNN.<sha1>.js is emitted by tools/build-widget-chunks.cjs, which hashes its own
  #    # contents into the filename, so a byte change always yields a new URL. Safe to
  #    # pin for a year with zero revalidation.
  for = "/assets/chunks/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # logos: only ever changed by hand, alongside a cache-name bump
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  for = "/assets/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800, must-revalidate"

[[headers]]
  # app-bundle.js (1 MB) and app-styles.css are un-hashed -> cheap 304
  for = "/assets/*.js"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
  # feature modules: exam-tracker, placement-tracker, semester-risk, certificates
  for = "/features/*/*.js"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
  for = "/features/*/*.css"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
  for = "/features/*/*.json"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"
