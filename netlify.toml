[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]

[[redirects]]
  from = "/api/public-config"
  to = "/.netlify/functions/public-config"
  status = 200

[[redirects]]
  from = "/api/cloud"
  to = "/.netlify/functions/cloud"
  status = 200

[[redirects]]
  from = "/api/ai-ask"
  to = "/.netlify/functions/ai-ask"
  status = 200

[[redirects]]
  from = "/api/sync"
  to = "/.netlify/functions/sync"
  status = 200

[[redirects]]
  from = "/api/leetcode/*"
  to = "/.netlify/functions/leetcode/:splat"
  status = 200

[[redirects]]
  from = "/api/codechef/*"
  to = "/.netlify/functions/codechef/:splat"
  status = 200

[[redirects]]
  from = "/api/gfg/*"
  to = "/.netlify/functions/gfg/:splat"
  status = 200

# Missing assets must be real 404s, not successful HTML cached as JavaScript.
# Existing files still win (these rules are not forced).
[[redirects]]
  from = "/assets/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/src/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/styles/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/assets/sounds/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/chunks/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    # These filenames aren't content-hashed on build, so "immutable, 1 year"
    # meant browsers never even checked for a new deploy. A short max-age
    # with must-revalidate lets the browser do a cheap conditional GET
    # (304 on no change) instead of blindly trusting a year-old cache.
    Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
  for = "/src/*"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
  for = "/styles/*"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, private"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Every directive below is justified by what the app actually loads; see
    # tests/test-csp-policy.cjs, which derives the source list from the repo and
    # fails if the policy grants a host nothing calls, or if the app starts
    # calling something the policy does not allow.
    #
    # The policy this replaces was `base-uri 'self'` alone - no fetch
    # directives at all - so any injected <script src="//evil"> would load and
    # run with full access to the user's study data.
    #
    # script-src: 'unsafe-inline' is still required because index.html ships six
    #   inline bootstrap blocks (theme bootstrap, mount stubs, expedite loader).
    #   What IS enforced now: no remote origin and no 'unsafe-eval', so the
    #   attacker's usual payload - loading a script from their own host - is
    #   blocked outright, and the app cannot be tricked into string-eval.
    #   Migrating those blocks to nonces is the next step and is tracked in the
    #   audit; it cannot be done from a static _headers file, which has no way
    #   to generate a per-response nonce.
    # style-src:  'unsafe-inline' is also required (inline <style> blocks and
    #   widget style attributes); CSS is a far smaller privilege than JS.
    # connect-src: same-origin /api/* proxies, Firebase Auth (identitytoolkit +
    #   securetoken) and api.open-meteo.com (water reminder). A host the app does
    #   not actually call must be removed rather than defaulting to a wildcard.
    # worker-src blob: because widgets construct their workers from blobs.
    # object-src 'none' + frame-ancestors 'none' because the dashboard embeds no
    #   plugins and must not be framed.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://api.open-meteo.com; worker-src 'self' blob:; manifest-src 'self'"

[[headers]]
  for = "/assets/cloud-auth.js"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/assets/*.json"
  [headers.values]
    Cache-Control = "public, max-age=60, must-revalidate"

[[headers]]
  for = "/404.html"
  [headers.values]
    Cache-Control = "no-store"
